<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Results | Veltrixo</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ===========================
        NAVBAR
============================ -->

<header class="navbar">

    <div class="logo-area">

        <div class="brand">

            <h1>VELTRIXO</h1>

            <div class="divider"></div>

            <div class="tagline">

                <span>Search Smarter.</span>

                <span>Spend Less.</span>

            </div>

        </div>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="features.html">Features</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>

<!-- ===========================
          RESULTS
============================ -->

<section class="results-page">

    <div class="results-container">

        <div class="results-search-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products, brands or models..."
            >

            <button id="searchBtn">

                <i class="fa-solid fa-wand-magic-sparkles"></i>

                Analyze

            </button>

        </div>

        <div id="resultsHeading" class="results-heading"></div>

        <div id="resultsStatus" class="results-status"></div>

        <div id="resultsGrid" class="results-grid"></div>

    </div>

</section>

<!-- ===========================
          FOOTER
============================ -->

<footer>

    <div class="footer-content">

        <h2>VELTRIXO</h2>

        <p>Search Smarter. Spend Less.</p>

        <small>© 2026 Veltrixo. All Rights Reserved.</small>

    </div>

</footer>

<script src="app.js"></script>

<script src="results.js"></script>

</body>

</html>
